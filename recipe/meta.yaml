{% set version = "3.0.2" %}

{% if cuda_compiler_version != "None" %}
{% set cuda_major = environ.get("cuda_compiler_version", "12.9").split(".")[0] | int %}
{% else %}
{% set cuda_major = 0 %}
{% endif %}

package:
  name: tsnecuda
  version: {{ version }}

source:
  - url: https://github.com/CannyLab/tsne-cuda/archive/refs/tags/{{ version }}.tar.gz
    sha256: 02a6b6d5367f0e0658a9362aa8bbc7b043af74d64a56ac849c640c57f8d22bf0
    patches:
      # Streamline the build for packaging: drop the vestigial gflags/gtest links,
      # compile out the ZMQ interactive-viz path and the standalone C++ CLI (which
      # pulled in the cxxopts submodule), and modernize CUDA arch selection (honor
      # CMAKE_CUDA_ARCHITECTURES; cover A100/H100/H200/B200 and CUDA 13). Folds into
      # upstream at the next tsne-cuda release, at which point this patch is dropped.
      - patches/0001-streamline-build-and-modernize-cuda-arch.patch

build:
  number: 1
  # only linux for the moment
  skip: true  # [not linux]
  skip: true  # [cuda_compiler_version == "None"]
  string: cuda{{ cuda_compiler_version | replace('.', '') }}py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}
    - cmake
    - make
  host:
    - python
    - pip
    - setuptools
    # tsnecuda links no CPU BLAS/LAPACK itself (its only GEMM is GPU cuBLAS);
    # FAISS carries its own BLAS transitively. Floor FAISS at 1.10 (the newest
    # on conda-forge) so we don't regress to the netlib-era 1.9.0.
    - libfaiss >=1.10
    # Steer FAISS to its self-contained openblas variant. The default *mkl
    # variant is broken against current conda-forge MKL (faiss expects
    # libmkl_intel_lp64.so.2, which oneMKL 2026.x no longer ships), and openblas
    # is lighter and portable. tsnecuda itself does not link this.
    - libblas * *openblas
    {% if cuda_major >= 12 %}
    - cuda-version {{ cuda_compiler_version }}
    - libcublas-dev
    - libcufft-dev
    - libcusolver-dev
    - libcusparse-dev
    {% endif %}
  run:
    - python
    - numpy
    # keep the FAISS BLAS variant consistent (and self-contained) at install time
    - libblas * *openblas

test:
  imports:
    # `import tsnecuda` does not dlopen libtsnecuda (the ctypes load happens when a
    # TSNE object is constructed), so this stays safe on the GPU-less CI runners.
    - tsnecuda

about:
  home: https://github.com/CannyLab/tsne-cuda
  license: BSD-3-Clause
  license_file:
    - LICENSE.tsnecuda

  summary: GPU Accelerated t-SNE for CUDA with Python bindings
  dev_url: https://github.com/CannyLab/tsne-cuda

extra:
  recipe-maintainers:
    - h-vetinari
    - DavidMChan
